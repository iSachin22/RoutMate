spring:
  # PostgreSQL profile — used on Render (and any other Postgres host).
  # Usage: SPRING_PROFILES_ACTIVE=postgres with DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS
  # (or paste a full JDBC URL into DB_URL, e.g. for external managed Postgres).
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routemate}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
