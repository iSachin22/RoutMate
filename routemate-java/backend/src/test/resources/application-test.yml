spring:
  datasource:
    url: jdbc:h2:mem:routemate-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

routemate:
  jwt:
    secret: routemate-test-secret-key-0123456789-0123456789-0123456789
    expiration-hours: 24
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500
  search:
    corridor-km: 50
